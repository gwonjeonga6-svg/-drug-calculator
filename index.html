<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>중환자실 약물 계산기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #f2f2f7; color: #1c1c1e; }
header { background: #fff; padding: 16px 20px; border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 99; }
header h1 { font-size: 20px; font-weight: 700; }
header p { font-size: 13px; color: #8e8e93; margin-top: 3px; }
.wrap { padding: 0 16px 40px; max-width: 500px; margin: 0 auto; }
.sec-label { font-size: 12px; font-weight: 600; color: #8e8e93; letter-spacing: 0.4px; margin: 20px 0 10px; }

/* 약물 버튼 */
.drug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.drug-btn { background: #fff; border: 2px solid #e5e5ea; border-radius: 14px; padding: 12px 10px; cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
.drug-btn.on { border-color: #007aff; background: #e8f1ff; }
.dn { font-size: 13px; font-weight: 700; color: #1c1c1e; display: block; margin-bottom: 3px; }
.ds { font-size: 11px; color: #8e8e93; display: block; line-height: 1.4; }
.drug-btn.on .dn { color: #007aff; }
.drug-btn.on .ds { color: #4a90d9; }

/* 의사 버튼 */
.dr-wrap { display: flex; flex-direction: column; gap: 8px; }
.dr-btn { background: #fff; border: 2px solid #e5e5ea; border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
.dr-btn.on { border-color: #007aff; background: #e8f1ff; }
.dr-name { font-size: 13px; font-weight: 700; display: block; margin-bottom: 3px; color: #1c1c1e; }
.dr-sub { font-size: 11px; color: #8e8e93; line-height: 1.5; }
.dr-btn.on .dr-name { color: #007aff; }
.dr-btn.on .dr-sub { color: #4a90d9; }

/* 희석정보 */
.mix-card { background: #fff; border-radius: 14px; padding: 14px 16px; }
.mix-info { font-size: 13px; color: #3a3a3c; line-height: 1.8; }
.mix-info strong { color: #007aff; }

/* 입력 카드 */
.input-card { background: #fff; border-radius: 16px; overflow: hidden; }
.irow { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid #f2f2f7; }
.irow:last-child { border-bottom: none; }
.irow label { font-size: 15px; font-weight: 500; flex: 1; }
.irow input { width: 120px; padding: 9px 12px; border: 1.5px solid #e5e5ea; border-radius: 10px; font-size: 17px; text-align: right; color: #1c1c1e; background: #f2f2f7; font-family: inherit; }
.irow input:focus { outline: none; border-color: #007aff; background: #fff; }
.unit-txt { font-size: 12px; color: #8e8e93; min-width: 90px; text-align: right; padding-left: 8px; }

/* 계산 방향 탭 */
.tab-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #e5e5ea; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.tab-btn { background: transparent; border: none; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; color: #8e8e93; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.tab-btn.on { background: #fff; color: #007aff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

/* 결과 */
.result-box { border-radius: 20px; padding: 24px 20px; margin-top: 4px; text-align: center; }
.result-box.blue { background: #007aff; }
.result-box.green { background: #34c759; }
.result-box.empty { background: #fff; border: 1.5px solid #e5e5ea; }
.rlabel { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 8px; }
.result-box.empty .rlabel { color: #8e8e93; }
.rval { font-size: 48px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -1px; }
.runit { font-size: 20px; font-weight: 400; color: rgba(255,255,255,0.75); }
.result-box.empty .rval { color: #c7c7cc; font-size: 34px; }
.result-box.empty .runit { color: #c7c7cc; }
.rmix { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 10px; line-height: 1.7; }
.result-box.empty .rmix { color: #aeaeb2; }

.warn { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: #fffbea; border-left: 3px solid #ffcc00; font-size: 12px; color: #7a6200; line-height: 1.6; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>중환자실 약물 계산기</h1>
  <p>감마 ↔ cc/hr 양방향 계산</p>
</header>
<div class="wrap">

  <p class="sec-label">약물 선택</p>
  <div class="drug-grid">
    <button class="drug-btn" id="d0" onclick="pickDrug(0)"><span class="dn">Norepinephrine</span><span class="ds">NE (Q-Phrine®)</span></button>
    <button class="drug-btn" id="d1" onclick="pickDrug(1)"><span class="dn">Midazolam</span><span class="ds">바스캄® 0.5mg/cc</span></button>
    <button class="drug-btn" id="d2" onclick="pickDrug(2)"><span class="dn">Midazolam</span><span class="ds">바스캄® 1mg/cc</span></button>
    <button class="drug-btn" id="d3" onclick="pickDrug(3)"><span class="dn">Remifentanil</span><span class="ds">REMIVA® 50mcg/cc</span></button>
    <button class="drug-btn" id="d4" onclick="pickDrug(4)"><span class="dn">Dexmedetomidine</span><span class="ds">Dexmedine® 4mcg/cc</span></button>
    <button class="drug-btn" id="d5" onclick="pickDrug(5)"><span class="dn">Rocuronium</span><span class="ds">ROCUNIUM® 5mg/cc</span></button>
  </div>

  <div id="drSection" class="hidden">
    <p class="sec-label">처방 의사 선택</p>
    <div class="dr-wrap">
      <button class="dr-btn" id="dr0" onclick="pickDoc(0)">
        <span class="dr-name">Dr. 심재광·성주욱 — Type 1</span>
        <span class="dr-sub">mcg/min · 40mcg/cc · NE 8mg + 5DW 192cc = 200cc</span>
      </button>
      <button class="dr-btn" id="dr1" onclick="pickDoc(1)">
        <span class="dr-name">Dr. 심재광·성주욱 — Type 2</span>
        <span class="dr-sub">mcg/min · 80mcg/cc · NE 8mg + 5DW 92cc = 100cc</span>
      </button>
      <button class="dr-btn" id="dr2" onclick="pickDoc(2)">
        <span class="dr-name">Dr. 배장환·임지훈·나해정·길송이</span>
        <span class="dr-sub">mcg/kg/min · 80mcg/cc · NE 8mg + 5DW 92cc = 100cc</span>
      </button>
    </div>
  </div>

  <div id="mixInfo" class="hidden">
    <p class="sec-label">희석 정보</p>
    <div class="mix-card">
      <div class="mix-info" id="mixTxt">—</div>
    </div>
  </div>

  <p class="sec-label">체중</p>
  <div class="input-card">
    <div class="irow">
      <label>체중</label>
      <input type="number" id="wt" inputmode="decimal" placeholder="0" min="1" max="300" oninput="calc()">
      <span class="unit-txt">kg</span>
    </div>
  </div>

  <p class="sec-label">계산 방향</p>
  <div class="tab-row">
    <button class="tab-btn on" id="tab0" onclick="setTab(0)">감마 → cc/hr</button>
    <button class="tab-btn" id="tab1" onclick="setTab(1)">cc/hr → 감마</button>
  </div>

  <div class="input-card">
    <div class="irow">
      <label id="inLabel">처방 용량</label>
      <input type="number" id="dose" inputmode="decimal" placeholder="0" min="0" step="any" oninput="calc()">
      <span class="unit-txt" id="inUnit">—</span>
    </div>
  </div>

  <div class="result-box empty" id="resBox" style="margin-top:12px">
    <p class="rlabel" id="resLabel">주입 속도</p>
    <p class="rval" id="resVal">—<span class="runit" id="resUnit"> cc/hr</span></p>
    <p class="rmix" id="resMix">약물을 먼저 선택해 주세요</p>
  </div>

  <div class="warn">⚠️ 참고용입니다. 실제 투약 전 처방 내용과 희석 농도를 반드시 재확인하세요.</div>
</div>

<script type="text/javascript">
var SD=-1, SDc=-1, TAB=0;

// concMcg: mcg/mL 농도, unit: 처방단위
// perKg: 체중 반영 여부, perMin: 분 단위 여부
var DRUGS = [
  {hasDoc:1},
  {concMcg:500,  unit:'mg/kg/hr',  perKg:1, perMin:0, mix:'바스캄® 50mg + 5DW 50cc = 100cc\n농도: 0.5mg/mL (500mcg/mL)'},
  {concMcg:1000, unit:'mg/kg/hr',  perKg:1, perMin:0, mix:'바스캄® 50mg 원액 50cc\n농도: 1mg/mL (1000mcg/mL)'},
  {concMcg:50,   unit:'mcg/kg/min',perKg:1, perMin:1, mix:'REMIVA® 5mg + 5DW 100cc = 100cc\n농도: 50mcg/mL'},
  {concMcg:4,    unit:'mcg/kg/hr', perKg:1, perMin:0, mix:'Dexmedine® 400mcg + 5DW 96cc = 100cc\n농도: 4mcg/mL'},
  {concMcg:5000, unit:'mg/kg/hr',  perKg:1, perMin:0, mix:'ROCUNIUM® 250mg + 5DW 25cc = 50cc\n농도: 5mg/mL (5000mcg/mL)'}
];
var DOCS = [
  {concMcg:40,  unit:'mcg/min',    perKg:0, perMin:1, mix:'NE 8mg(2@) + 5DW 192cc = 200cc\n농도: 40mcg/mL · 처방단위: mcg/min'},
  {concMcg:80,  unit:'mcg/min',    perKg:0, perMin:1, mix:'NE 8mg(2@) + 5DW 92cc = 100cc\n농도: 80mcg/mL · 처방단위: mcg/min'},
  {concMcg:80,  unit:'mcg/kg/min', perKg:1, perMin:1, mix:'NE 8mg(2@) + 5DW 92cc = 100cc\n농도: 80mcg/mL · 처방단위: mcg/kg/min'}
];

function getOpt() {
  if(SD<0) return null;
  if(DRUGS[SD].hasDoc) return SDc>=0 ? DOCS[SDc] : null;
  return DRUGS[SD];
}

function pickDrug(i) {
  SD=i; SDc=-1;
  for(var b=0;b<6;b++) document.getElementById('d'+b).className='drug-btn';
  document.getElementById('d'+i).className='drug-btn on';
  for(var c=0;c<3;c++) document.getElementById('dr'+c).className='dr-btn';
  document.getElementById('drSection').className = DRUGS[i].hasDoc ? '' : 'hidden';
  updateMixInfo();
  calc();
}

function pickDoc(j) {
  SDc=j;
  for(var c=0;c<3;c++) document.getElementById('dr'+c).className='dr-btn';
  document.getElementById('dr'+j).className='dr-btn on';
  updateMixInfo();
  calc();
}

function updateMixInfo() {
  var opt = getOpt();
  var sec = document.getElementById('mixInfo');
  var txt = document.getElementById('mixTxt');
  if(!opt) { sec.className='hidden'; return; }
  sec.className='';
  txt.innerHTML = opt.mix.replace(/\n/g,'<br>').replace(/(농도:[^<]+)/g,'<strong>$1</strong>');
}

function setTab(t) {
  TAB=t;
  document.getElementById('tab0').className = t===0 ? 'tab-btn on' : 'tab-btn';
  document.getElementById('tab1').className = t===1 ? 'tab-btn on' : 'tab-btn';
  document.getElementById('dose').value='';
  updateLabels();
  calc();
}

function updateLabels() {
  var opt = getOpt();
  if(TAB===0) {
    document.getElementById('inLabel').textContent='처방 용량 (감마)';
    document.getElementById('inUnit').textContent = opt ? opt.unit : '—';
    document.getElementById('resLabel').textContent='주입 속도';
    document.getElementById('resUnit').textContent=' cc/hr';
  } else {
    document.getElementById('inLabel').textContent='현재 주입 속도';
    document.getElementById('inUnit').textContent='cc/hr';
    document.getElementById('resLabel').textContent='감마 (처방 용량)';
    document.getElementById('resUnit').textContent = opt ? ' '+opt.unit : '—';
  }
}

function calc() {
  var opt = getOpt();
  updateLabels();

  var w = parseFloat(document.getElementById('wt').value);
  var d = parseFloat(document.getElementById('dose').value);
  var box = document.getElementById('resBox');
  var rv = document.getElementById('resVal');
  var rm = document.getElementById('resMix');
  var ru = document.getElementById('resUnit');

  if(!opt) {
    box.className='result-box empty';
    rv.innerHTML='—<span class="runit"> —</span>';
    rm.textContent = SD>=0 && DRUGS[SD].hasDoc ? '처방 의사를 선택해 주세요' : '약물을 먼저 선택해 주세요';
    return;
  }
  if(!w || isNaN(w) || w<=0 || !d || isNaN(d) || d<=0) {
    box.className='result-box empty';
    rv.innerHTML='—<span class="runit">'+(TAB===0?' cc/hr':' '+opt.unit)+'</span>';
    rm.textContent='체중과 용량을 입력해 주세요';
    return;
  }

  var result=0;
  var c = opt.concMcg;

  if(TAB===0) {
    // 감마 → cc/hr
    // cc/hr = (dose_mcg_per_unit * weight_factor * time_factor) / concMcg
    if(opt.perKg && opt.perMin) result=(d*w*60)/c;       // mcg/kg/min
    else if(opt.perKg && !opt.perMin) result=(d*w*1000)/c; // mg/kg/hr → mcg먼저
    else if(!opt.perKg && opt.perMin) result=(d*60)/c;    // mcg/min
    ru.textContent=' cc/hr';
    box.className='result-box blue';
    rv.innerHTML=result.toFixed(2)+'<span class="runit"> cc/hr</span>';
  } else {
    // cc/hr → 감마
    if(opt.perKg && opt.perMin) result=(d*c)/(w*60);       // → mcg/kg/min
    else if(opt.perKg && !opt.perMin) result=(d*c)/(w*1000); // → mg/kg/hr
    else if(!opt.perKg && opt.perMin) result=(d*c)/60;      // → mcg/min
    ru.textContent=' '+opt.unit;
    box.className='result-box green';
    rv.innerHTML=result.toFixed(3)+'<span class="runit"> '+opt.unit+'</span>';
  }
  rm.textContent=opt.mix;
}
</script>
</body>
</html>
